name: Linux
on:
  pull_request:

  # Caches are scoped by ref: a PR reads its base branch's cache but never another PR's.
  # Without a run on push, main and next hold no cache and every PR starts cold.
  push:
    branches: [main, next]

env:
  DEFAULT_BUILD_TYPE: Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libzip-dev ccache qt6-{base,declarative}-dev ninja-build
      - name: Fetch repository
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Cache FetchContent
        uses: actions/cache@v6
        with:
          path: ${{github.workspace}}/build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-
      - name: Configure
        run: |
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE="${{ env.DEFAULT_BUILD_TYPE }}" -DENABLE_COVERAGE=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_GENERATOR=Ninja
      - name: Build
        run: |
          cmake --build ${{github.workspace}}/build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 'linux-build'
          path: ${{github.workspace}}/build
          if-no-files-found: 'error'
          retention-days: 1
          include-hidden-files: true

  test-linux:
    needs: build-linux
    runs-on: ubuntu-26.04
    name: Test
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libzip-dev qt6-{base,declarative}-dev
      - name: Install gcovr
        run: pipx install gcovr
      - name: Fetch repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Unpack build artifacts
        uses: actions/download-artifact@v8
        with:
          name: 'linux-build'
          path: ${{github.workspace}}/build
      - name: Setup correct permissions
        run: |
          chmod -R 777 ${{github.workspace}}/build
      - name: Test
        run: ctest --test-dir ${{github.workspace}}/build --output-on-failure --no-tests=error -V
      - name: Coverage report
        run: |
          # Exclude tests, autogen, and Qt-generated files.
          gcovr --root . ${{github.workspace}}/build \
            --filter 'src/' \
            --exclude 'src/tests/' \
            --exclude 'src/App.*' \
            --exclude 'src/main.cpp' \
            --exclude '.*_autogen/.*' \
            --exclude '.*/moc_.*' \
            --exclude '.*/qrc_.*' \
            --exclude-branches-by-pattern '\s*(qC(Debug|Info|Warning|Critical|Fatal)|Q_STATIC_LOGGING_CATEGORY)\b.*' \
            --exclude '.*qmltyperegistrations.*' \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --print-summary \
            --cobertura coverage.xml --cobertura-pretty \
            --markdown coverage.md \
            -j "$(nproc)"
      - name: Job summary
        run: |
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          name: 'VSMM-Coverage'
          files: ./coverage.xml
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
          verbose: true
          slug: ${{ github.repository }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  appimage-linux:
    name: Build & Test AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch repository
        uses: actions/checkout@v7

      # zipcmp/zipmerge/ziptool: libzip-dev's CMake config references them but doesn't
      # depend on them, so find_package fails without them (Debian #973280)
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ninja-build ccache libzip-dev zipcmp zipmerge ziptool

      # Runner ships CMake 3.31, below the 4.2 CMakeLists.txt requires
      - name: Install CMake
        run: pipx install cmake

      # Install Qt from official binaries to cover glibc 2.39 minimal support for AppImage
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.10.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true
          cache-key-prefix: 'qt-v6.10.0-linux'

      # Separate cache from build-linux
      - name: Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-appimage-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-appimage-ccache-

      - name: Configure
        run: |
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE="${{ env.DEFAULT_BUILD_TYPE }}" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_GENERATOR=Ninja -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build ${{github.workspace}}/build

      # ISO week in the key: the tools track the mutable "continuous" tag, so this refreshes
      # them weekly instead of pinning to whatever was cached first.
      - name: Tool cache key
        id: toolkey
        run: echo "week=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"

      - name: Cache AppImage tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/vsmm-appimage-tools
          key: ${{ runner.os }}-linuxdeploy-continuous-${{ steps.toolkey.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-linuxdeploy-continuous-

      - name: Build AppImage
        env:
          QMAKE: '${{ env.QT_ROOT_DIR }}/bin/qmake6'
        run: ./scripts/build_appimage.py "${{github.workspace}}/build"

      # Exit 124 (timeout) is success: a missing Qt plugin or QML module still builds fine
      # and only aborts on launch.
      - name: Smoke-test AppImage
        env:
          # Runner has no FUSE and no display.
          APPIMAGE_EXTRACT_AND_RUN: 1
          QT_QPA_PLATFORM: offscreen
        run: |
          appimage=$(ls "${{github.workspace}}"/build/*.AppImage)
          echo "launching $appimage"
          set +e
          timeout 15 "$appimage"
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::AppImage exited with code $code during startup instead of running"
            exit 1
          fi
          echo "AppImage started and stayed running"
