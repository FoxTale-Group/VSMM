name: Build Windows & Test
on:
  pull_request:
    branches: [main, next]
  # Caches are scoped by ref: a PR reads its base branch's cache but never another PR's.
  # Without a run on push, main and next hold no cache and every PR starts cold.
  push:
    branches: [main, next]

env:
  DEFAULT_BUILD_TYPE: Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
      # sccache uses a single backend. Do not also set SCCACHE_DIR, it would be ignored.
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Exclude workspace from Defender
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($path in "${{ github.workspace }}", "$env:VCPKG_INSTALLATION_ROOT") {
            if ($path) { Add-MpPreference -ExclusionPath $path }
          }
          foreach ($proc in 'cl.exe','link.exe','ninja.exe','sccache.exe') {
            Add-MpPreference -ExclusionProcess $proc
          }

      - name: Fetch repository
        uses: actions/checkout@v7

      - name: Create cache directories
        run: |
          New-Item -ItemType Directory -Force -Path ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('.github/workflows/build-windows.yml') }} # Reset cache when workflow is changed
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install libzip with vcpkg
        run: vcpkg install libzip:x64-windows

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
          cache-key-prefix: 'qt-v6.10.0'

      - name: Setup Build SCCache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.10.0"

      - name: Configure CMake Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=${{ env.DEFAULT_BUILD_TYPE }} -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" -DX_VCPKG_APPLOCAL_DEPS_INSTALL=ON

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build-win --config ${{ env.DEFAULT_BUILD_TYPE }}

      - name: Test
        run: ctest --test-dir build-win --output-on-failure --no-tests=error -V

      - name: SCCache Stats
        if: always()
        run: sccache --show-stats
