name: Build & Test
on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Release type"
        required: true
        default: "Debug"
  pull_request:
    branches:
      - main

env:
  DEFAULT_BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Fetch repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install qt6-{base,declarative}-dev libzip-dev qml6-module-qtquick-controls qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - name: Configure
        run: |
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE="${{ inputs.releaseType || env.DEFAULT_BUILD_TYPE }}"
      - name: Build
        run: |
          cmake --build ${{github.workspace}}/build