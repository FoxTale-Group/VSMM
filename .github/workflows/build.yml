name: Build Linux & Test
on:
  pull_request:

  # Caches are scoped by ref: a PR reads its base branch's cache but never another PR's.
  # Without a run on push, main and next hold no cache and every PR starts cold.
  push:
    branches: [main, next]

env:
  DEFAULT_BUILD_TYPE: Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-26.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libzip-dev ccache qt6-{base,declarative}-dev ninja-build
      - name: Fetch repository
        uses: actions/checkout@v7
      - name: Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Cache FetchContent
        uses: actions/cache@v6
        with:
          path: ${{github.workspace}}/build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-
      - name: Configure
        run: |
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE="${{ env.DEFAULT_BUILD_TYPE }}" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_GENERATOR=Ninja
      - name: Build
        run: |
          cmake --build ${{github.workspace}}/build
      - name: Test
        run: ctest --test-dir ${{github.workspace}}/build --output-on-failure --no-tests=error -V

      # ISO week in the key: the tools track the mutable "continuous" tag, so this refreshes
      # them weekly instead of pinning to whatever was cached first.
      - name: Tool cache key
        id: toolkey
        run: echo "week=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"

      - name: Cache AppImage tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/vsmm-appimage-tools
          key: ${{ runner.os }}-linuxdeploy-continuous-${{ steps.toolkey.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-linuxdeploy-continuous-

      - name: Build AppImage
        run: ./scripts/build_appimage.py "${{github.workspace}}/build"

      # Exit 124 (timeout) is success: a missing Qt plugin or QML module still builds fine
      # and only aborts on launch.
      - name: Smoke-test AppImage
        env:
          # Runner has no FUSE and no display.
          APPIMAGE_EXTRACT_AND_RUN: 1
          QT_QPA_PLATFORM: offscreen
        run: |
          appimage=$(ls "${{github.workspace}}"/build/*.AppImage)
          echo "launching $appimage"
          set +e
          timeout 15 "$appimage"
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::AppImage exited with code $code during startup instead of running"
            exit 1
          fi
          echo "AppImage started and stayed running"
