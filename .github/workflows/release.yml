name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DEFAULT_BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }},
  cancel-in-progress: false

jobs:
  prepare-release-version:
    if: github.ref_name == 'main' || github.ref_name == 'next'
    permissions:
      contents: write
      pull-requests: read

    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1.11.0
        with:
          token: ${{ github.token }}
          branch: ${{ github.ref_name }}
          majorList: 'feat!,fix!'
          tagFilter: '^v[0-9]+\.[0-9]+\.[0-9]+$'
          noNewCommitBehavior: 'current'
          noVersionBumpBehavior: 'current'
          skipInvalidTags: true
          maxTagsToFetch: '30'
          scopeList: 'ui,loader,store,network,search,settings,backend'
      - name: Determine release channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "isPrerelease=false" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.semver.outputs.next }}" >> "$GITHUB_OUTPUT"
            echo "versionStrict=${{ steps.semver.outputs.nextStrict }}" >> "$GITHUB_OUTPUT"
          else
            # Per-version sequential RC: find the highest existing vX.Y.Z-rc.N tag and add 1
            lastRc=$(git tag -l "${{ steps.semver.outputs.next }}-rc.*" | sed 's/.*-rc\.//' | sort -n | tail -n1)
            rc=$(( ${lastRc:-0} + 1 ))
            echo "isPrerelease=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.semver.outputs.next }}-rc.${rc}" >> "$GITHUB_OUTPUT"
            echo "versionStrict=${{ steps.semver.outputs.nextStrict }}-rc.${rc}" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      bumpVersion: ${{ steps.semver.outputs.bump }}
      releaseVersion: ${{ steps.channel.outputs.version }} # with v prefix
      releaseVersionStrict: ${{ steps.channel.outputs.versionStrict }} # without v prefix
      isPrerelease: ${{ steps.channel.outputs.isPrerelease }}
  create-package:
    needs: [prepare-release-version]
    if: (github.ref_name == 'main' || github.ref_name == 'next') && needs.prepare-release-version.outputs.bumpVersion != 'none'

    permissions:
      contents: write
      pull-requests: read   # git-cliff GitHub integration resolves PR numbers/authors

    runs-on: ubuntu-26.04 # change to ubuntu-latest when it's 26.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libzip-dev ninja-build
      - name: Fetch repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Bump project version in CMakeLists.txt
        run: |
          version='${{ needs.prepare-release-version.outputs.releaseVersionStrict }}'
          sed -i -E "s/(set\(VSMM_RELEASE_VERSION )\"[^\"]*\"/\1\"${version}\"/" CMakeLists.txt
      - name: Generate CHANGELOG.md
        id: generate-changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ needs.prepare-release-version.outputs.releaseVersion }} --unreleased
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create release commit with tag
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(release): ${{ needs.prepare-release-version.outputs.releaseVersionStrict }}'
          branch: ${{ github.ref_name }}
          commit_options: '--no-verify --signoff'
          file_pattern: 'CMakeLists.txt'
          tag_name: ${{ needs.prepare-release-version.outputs.releaseVersion }}
          tagging_message: 'Release ${{ needs.prepare-release-version.outputs.releaseVersionStrict }}'
          disable_globbing: true
          create_git_tag_only: false
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.11.1'
      - name: Configure
        id: configure
        run: |
          echo "buildDir=${{ env.BUILD_DIR }}" >> ${GITHUB_OUTPUT}
          cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE="${{ env.DEFAULT_BUILD_TYPE }}" -DCMAKE_GENERATOR=Ninja
        env:
          BUILD_DIR: '${{ github.workspace }}/build'
      - name: Build & Package
        run: |
          cmake --build ${{ steps.configure.outputs.buildDir }}
          cd ${{ steps.configure.outputs.buildDir }} && ninja package && cd ${{ github.workspace }}
      - name: Create release
        uses: ncipollo/release-action@v1.21.0
        with:
          name: ${{ needs.prepare-release-version.outputs.releaseVersion }}
          artifacts: '${{ steps.configure.outputs.buildDir }}/pkg/*.xz,${{ steps.configure.outputs.buildDir }}/pkg/*.gz,${{ steps.configure.outputs.buildDir }}/pkg/*.rpm,${{ steps.configure.outputs.buildDir }}/pkg/*.deb'
          body: ${{ steps.generate-changelog.outputs.content }}
          tag: ${{ needs.prepare-release-version.outputs.releaseVersion }}
          prerelease: ${{ needs.prepare-release-version.outputs.isPrerelease }}
          makeLatest: ${{ needs.prepare-release-version.outputs.isPrerelease == 'false' }}
          immutableCreate: true
